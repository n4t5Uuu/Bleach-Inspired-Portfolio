<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Weekly Chapter sketch</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1440px; height:900px; overflow:hidden; background:#0A0A0A; color:#0A0A0A; font-family:"Segoe UI",system-ui,sans-serif; }
  .page { position:absolute; inset:24px; display:grid; grid-template-columns: 1.4fr 1fr 1fr; grid-template-rows: 1.3fr 1fr; gap:14px; }
  .p { background:#F2F0EA; position:relative; overflow:hidden; }
  .tone { background-image: radial-gradient(#0A0A0A 22%, transparent 24%); background-size:8px 8px; background-color:#F2F0EA; }
  .splash { grid-row: 1 / 3; grid-column: 3; }
  .splash h1 { position:absolute; right:30px; top:40px; writing-mode:vertical-rl; font-size:120px; font-weight:900; line-height:1; }
  .speed { position:absolute; inset:0; background: repeating-conic-gradient(from 0deg at 40% 60%, #0A0A0A 0 1deg, transparent 1deg 6deg); opacity:.35; }
  .feature { grid-column: 1 / 3; }
  .feature h2 { position:absolute; left:40px; bottom:40px; font-size:64px; font-weight:900; background:#F2F0EA; padding:14px 22px; }
  .black { background:#0A0A0A; }
  .cap { position:absolute; left:24px; top:24px; background:#fff; border:3px solid #0A0A0A; padding:14px 18px; font-size:24px; font-weight:800; }
  .bubble { position:absolute; left:40px; top:40px; background:#fff; border:3px solid #0A0A0A; border-radius:50%; padding:40px 50px; font-size:24px; font-weight:700; }
</style>
</head>
<body>
  <div class="page">
    <div class="p feature"><div class="speed"></div><h2>PROJECT 01</h2></div>
    <div class="p splash tone"><h1>YOUR NAME</h1></div>
    <div class="p black"><div class="cap">RESUME PDF</div></div>
    <div class="p"><div class="bubble">Software developer</div></div>
  </div>
</body>
</html>
