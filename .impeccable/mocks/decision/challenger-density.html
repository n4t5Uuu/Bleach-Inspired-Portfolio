<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Dense Index sketch</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1440px; height:900px; overflow:hidden; background:#fff; color:#111; font-family:"Yu Gothic","Segoe UI",sans-serif; font-size:13px; }
  .top { height:56px; border-bottom:1px solid #D6D6D6; display:flex; align-items:center; gap:24px; padding:0 24px; }
  .top b { font-size:24px; font-weight:900; }
  .top .tab { background:#E60012; color:#fff; padding:8px 14px; font-weight:700; font-size:16px; }
  .grid { display:grid; grid-template-columns: 260px 1fr 1fr 1fr 300px; grid-template-rows: 300px 260px 228px; gap:1px; background:#D6D6D6; height:844px; }
  .m { background:#fff; padding:12px; position:relative; }
  .m h3 { display:inline-block; background:#E60012; color:#fff; font-size:14px; padding:3px 8px; margin-bottom:8px; }
  .big { grid-column: 2 / 5; }
  .big h2 { font-size:64px; font-weight:900; line-height:1; margin-top:30px; }
  .big p { font-size:24px; margin-top:16px; }
  .rail { grid-row: 1 / 4; }
  .side { grid-row: 1 / 3; }
  .line { height:8px; background:#eee; margin:8px 0; }
</style>
</head>
<body>
  <div class="top"><b>YOUR NAME</b><span class="tab">RESUME PDF</span><span>Projects</span><span>Experience</span><span>About</span></div>
  <div class="grid">
    <div class="m rail"><h3>INDEX</h3><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div></div>
    <div class="m big"><h3>PROFILE</h3><h2>Your Name</h2><p>Software Developer, placeholder summary</p></div>
    <div class="m side"><h3>EXPERIENCE</h3><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div></div>
    <div class="m"><h3>PROJECT 01</h3><div class="line"></div><div class="line"></div></div>
    <div class="m"><h3>PROJECT 02</h3><div class="line"></div><div class="line"></div></div>
    <div class="m"><h3>PROJECT 03</h3><div class="line"></div><div class="line"></div></div>
    <div class="m"><h3>SKILLS</h3><div class="line"></div><div class="line"></div></div>
    <div class="m"><h3>PROJECT 04</h3><div class="line"></div></div>
    <div class="m"><h3>PROJECT 05</h3><div class="line"></div></div>
    <div class="m"><h3>CONTACT</h3><div class="line"></div></div>
  </div>
</body>
</html>
